        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

  &lt;h2&gt;Bug atlas: Bend 2&lt;/h2&gt;
  &lt;div class=&quot;text-small&quot;&gt;Bend 2.0.9 · selected language overlaps · source-level guarantees&lt;/div&gt;
  &lt;svg class=&quot;atlas-map&quot; role=&quot;img&quot; aria-label=&quot;Overlap of single-use resource checking and general specification proofs. Rust belongs to the resource set; Lean and Dafny to the proof set; Bend to both. All four also have static type checking.&quot;&gt;&lt;/svg&gt;
  &lt;div class=&quot;text-small&quot;&gt;All four: static type checking. Set membership names a capability, not protection for every program. Areas are schematic.&lt;/div&gt;
  &lt;div class=&quot;legend text-small&quot;&gt;&lt;span class=&quot;auto&quot;&gt;● Built-in restriction&lt;/span&gt;&lt;span class=&quot;proof&quot;&gt;◆ Explicit type or proof required&lt;/span&gt;&lt;span&gt;○ Outside the guarantee&lt;/span&gt;&lt;/div&gt;

  &lt;h3 class=&quot;region-title&quot;&gt;01 · Built-in restrictions&lt;/h3&gt;
  &lt;details open&gt;
    &lt;summary&gt;Type confusion and missing cases &lt;span class=&quot;auto&quot;&gt;●&lt;/span&gt;&lt;/summary&gt;
    &lt;div class=&quot;tag-row&quot; data-languages=&quot;Bend,Rust,Lean,Dafny&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;example&quot;&gt;&lt;code&gt;def wrong() -&amp;gt; Nat: True{}&lt;/code&gt;&lt;br&gt;&lt;code&gt;match Bool&lt;/code&gt; with only a &lt;code&gt;True&lt;/code&gt; branch.&lt;/div&gt;
    &lt;div class=&quot;condition&quot;&gt;Bend rejects the wrong result type and the uncovered &lt;code&gt;False&lt;/code&gt; case. Both rejection examples were run against the pinned checker. A wildcard that returns the wrong answer still type-checks.&lt;/div&gt;
    &lt;div class=&quot;text-small&quot;&gt;Overlap: well-typed values and exhaustive matches in the checked fragments. Rust can still put a panic inside a branch.&lt;/div&gt;
  &lt;/details&gt;
  &lt;details&gt;
    &lt;summary&gt;Reusing a consumed resource &lt;span class=&quot;auto&quot;&gt;●&lt;/span&gt;&lt;/summary&gt;
    &lt;div class=&quot;tag-row&quot; data-languages=&quot;Bend,Rust&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;example&quot;&gt;&lt;code&gt;Nat.add(f(0n), f(1n))&lt;/code&gt;, where &lt;code&gt;f: Nat -&amp;gt; Nat&lt;/code&gt;.&lt;/div&gt;
    &lt;div class=&quot;condition&quot;&gt;Bend rejects the second use of this closure. Arrays and opaque handles also have ownership-bearing types. Rust prevents reuse after a move of a non-Copy value. Copyable data is a different case.&lt;/div&gt;
    &lt;div class=&quot;text-small&quot;&gt;Bend is affine: at most once, not exactly once. This does not prove that every required action, close operation or transaction occurs.&lt;/div&gt;
  &lt;/details&gt;
  &lt;details&gt;
    &lt;summary&gt;Unsynchronized shared-memory data races &lt;span class=&quot;auto&quot;&gt;●&lt;/span&gt;&lt;/summary&gt;
    &lt;div class=&quot;tag-row&quot; data-languages=&quot;Bend,Rust&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;example&quot;&gt;Two parallel branches mutate the same owned array.&lt;/div&gt;
    &lt;div class=&quot;condition&quot;&gt;Bend&#x27;s safe pure fork/join code cannot share that ownership. Safe Rust uses ownership, borrowing and thread-safety traits to exclude data races.&lt;/div&gt;
    &lt;div class=&quot;text-small&quot;&gt;Scope: source-level memory access under the language rules. Protocol races, deadlocks, external files and unsafe shared arrays are separate problems.&lt;/div&gt;
  &lt;/details&gt;
  &lt;details&gt;
    &lt;summary&gt;Unbounded self-recursion in the total fragment &lt;span class=&quot;auto&quot;&gt;●&lt;/span&gt;&lt;/summary&gt;
    &lt;div class=&quot;tag-row&quot; data-languages=&quot;Bend,Lean,Dafny&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;example&quot;&gt;&lt;code&gt;def loop(n: Nat) -&amp;gt; Nat: loop(n)&lt;/code&gt;&lt;/div&gt;
    &lt;div class=&quot;condition&quot;&gt;Bend rejects this unchanged self-call. Lean&#x27;s total definitions and Dafny&#x27;s terminating verified code require termination evidence too.&lt;/div&gt;
    &lt;div class=&quot;text-small&quot;&gt;Bend: exclude @unsafe and host effects. Lean: exclude partial/unsafe definitions. Dafny: exclude decreases *. Termination supplies no useful latency or memory bound.&lt;/div&gt;
  &lt;/details&gt;

  &lt;h3 class=&quot;region-title&quot;&gt;02 · Protection you must specify&lt;/h3&gt;
  &lt;details open&gt;
    &lt;summary&gt;An optimization changes the answer &lt;span class=&quot;proof&quot;&gt;◆&lt;/span&gt;&lt;/summary&gt;
    &lt;div class=&quot;tag-row&quot; data-languages=&quot;Bend,Lean,Dafny&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;example&quot;&gt;&lt;code&gt;sum(d,i) = seq(pow2(d),i)&lt;/code&gt; for every &lt;code&gt;d,i: Nat&lt;/code&gt;.&lt;/div&gt;
    &lt;div class=&quot;condition&quot;&gt;The official Bend sum law rules out a changed range, omitted terms or duplicated terms whenever these change the result. The implementation and a completed proof must satisfy that unchanged law.&lt;/div&gt;
    &lt;div class=&quot;text-small&quot;&gt;Checking main alone is insufficient. Check the proof book; exclude holes and unsafe dependencies. Equality preserves a wrong specification too.&lt;/div&gt;
  &lt;/details&gt;
  &lt;details&gt;
    &lt;summary&gt;A sort loses or invents elements &lt;span class=&quot;proof&quot;&gt;◆&lt;/span&gt;&lt;/summary&gt;
    &lt;div class=&quot;tag-row&quot; data-languages=&quot;Bend,Lean,Dafny&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;example&quot;&gt;Input &lt;code&gt;[3,1,3]&lt;/code&gt;; output &lt;code&gt;[1,3]&lt;/code&gt;.&lt;/div&gt;
    &lt;div class=&quot;condition&quot;&gt;Specify sorted order AND equal counts for every value. Sortedness alone accepts this broken output. A checked proof of both properties excludes it.&lt;/div&gt;
    &lt;div class=&quot;text-small&quot;&gt;These languages can express and check such properties. This example describes the required contract; it is not a newly executed proof.&lt;/div&gt;
  &lt;/details&gt;
  &lt;details&gt;
    &lt;summary&gt;Wrong index, zero divisor or unintended wraparound &lt;span class=&quot;proof&quot;&gt;◆&lt;/span&gt;&lt;/summary&gt;
    &lt;div class=&quot;tag-row&quot; data-languages=&quot;Bend,Lean,Dafny&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;example&quot;&gt;Index &lt;code&gt;9&lt;/code&gt; into eight slots; treating &lt;code&gt;U32&lt;/code&gt; addition as unbounded arithmetic.&lt;/div&gt;
    &lt;div class=&quot;condition&quot;&gt;Bend 2.0.9 array indices wrap; its Base U32 division defines a zero-divisor result. These are defined behaviors, not compile-time refusals. Prove the application&#x27;s index range, nonzero divisor or numeric bound when it needs one.&lt;/div&gt;
    &lt;div class=&quot;text-small&quot;&gt;Nat avoids fixed-width overflow, but resource exhaustion remains possible. Rust&#x27;s ordinary indexing check occurs at runtime, so it is not tagged here as a compile-time range proof.&lt;/div&gt;
  &lt;/details&gt;
  &lt;details&gt;
    &lt;summary&gt;Invalid state transitions and broken accounting &lt;span class=&quot;proof&quot;&gt;◆&lt;/span&gt;&lt;/summary&gt;
    &lt;div class=&quot;tag-row&quot; data-languages=&quot;Bend,Lean,Dafny&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;example&quot;&gt;A transfer creates money; a replay reaches a forbidden state.&lt;/div&gt;
    &lt;div class=&quot;condition&quot;&gt;State an invariant over every permitted transition or every replay from an admitted initial state, then prove preservation. A checked model can exclude these failures within that model.&lt;/div&gt;
    &lt;div class=&quot;text-small&quot;&gt;A proof about an in-memory transition does not establish database atomicity, authentic inputs, authorization policy or correct foreign I/O. Rust can also encode selected state restrictions with typestate; general proofs need additional tooling.&lt;/div&gt;
  &lt;/details&gt;

  &lt;h3 class=&quot;region-title&quot;&gt;03 · Outside the boundary&lt;/h3&gt;
  &lt;details&gt;
    &lt;summary&gt;The law is incomplete or the wrong law &lt;span&gt;○&lt;/span&gt;&lt;/summary&gt;
    &lt;div class=&quot;example&quot;&gt;“Sorted” without “same elements”; “balance conserved” without “only authorized transfers.”&lt;/div&gt;
    &lt;div class=&quot;condition&quot;&gt;No language shown infers the missing requirement from a proof. The checker verifies the proposition supplied to it.&lt;/div&gt;
  &lt;/details&gt;
  &lt;details&gt;
    &lt;summary&gt;Compiler bugs, foreign code and real-world failures &lt;span&gt;○&lt;/span&gt;&lt;/summary&gt;
    &lt;div class=&quot;example&quot;&gt;Incorrect GPU code generation, an I/O deadlock, lost network replies, out-of-memory failure.&lt;/div&gt;
    &lt;div class=&quot;condition&quot;&gt;Source proofs rely on the checker and on faithful execution. Bend&#x27;s pinned README reports a mismatch with its Lean formalization and possible early consistency bugs. Its F32 model does not provide general floating-point proofs.&lt;/div&gt;
    &lt;div class=&quot;text-small&quot;&gt;“Impossible” here is conditional on a sound checked fragment, complete evidence and the stated assumptions. It is not certification of Bend&#x27;s implementation.&lt;/div&gt;
  &lt;/details&gt;

    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
