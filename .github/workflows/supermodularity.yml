name: verify-supermodularity
on:
  push:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
      - name: Setup pinned upstream and overlay
        run: ./repo setup --target upstream
      - name: Verify complete repository
        run: ./repo verify
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-verification
          path: .repo/runs/
          include-hidden-files: true
          if-no-files-found: error
